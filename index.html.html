<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rover’ı Tamamla!</title>
<style>
:root{--bg1:#1b2450;--bg2:#0b1020;--card:#fff8ee;--ink:#1a1f36;--muted:#5b617a;--accent:#e8553d;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root{--card:#171c36;--ink:#f1f3ff;--muted:#a7aed6}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,var(--bg1),var(--bg2) 75%);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);display:flex;justify-content:center;padding:14px}
.card{width:100%;max-width:560px;background:var(--card);border-radius:20px;padding:16px;box-shadow:0 10px 40px #0006}
h1{margin:0 0 4px;font-size:24px}
.sub{margin:0 0 12px;color:var(--muted);font-size:15px}
#wrap{position:relative}
#board{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);aspect-ratio:4/3;gap:6px}
.slot{position:relative;border:1px dashed #8886;border-radius:4px;background:#0002}
.slot.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
#peek{position:absolute;inset:0;display:none;gap:6px;pointer-events:none}#peek div{border-radius:4px;background-repeat:no-repeat;box-shadow:0 2px 6px #0006}
#tray{display:grid;grid-template-columns:repeat(4,var(--tw));gap:6px;justify-content:center;margin-top:12px}
.p{position:relative;width:var(--tw);height:var(--th);background-repeat:no-repeat;border-radius:4px;cursor:grab;touch-action:none;box-shadow:0 2px 6px #0006}
.p.drag{position:fixed;z-index:50;cursor:grabbing;box-shadow:0 10px 24px #0008}
.p.inslot{width:100%;height:100%}
.ph{width:var(--tw);height:var(--th)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
button.b{font:600 15px system-ui,sans-serif;padding:10px 14px;border-radius:999px;border:2px solid var(--accent);background:transparent;color:var(--ink);cursor:pointer}
button.b.main{background:var(--accent);color:#fff}
.moves{margin-left:auto;font-weight:700;text-align:right;line-height:1.5}
#win{display:none;margin-top:14px;padding:14px;border-radius:14px;background:#2e9e5b22;border:2px solid #2e9e5b}
#win h2{margin:0 0 6px;font-size:20px}
#win p{margin:4px 0}
.credit{margin-top:12px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="card">
  <h1>Rover’ı tamamla! 🚀</h1>
  <p class="sub">Parçaları sürükleyip çerçeveye bırak. Yanlış yere koyarsan orada kalır, tekrar sürükleyebilirsin.</p>
  <div id="wrap"><div id="board"></div><div id="peek"></div></div>
  <div id="tray"></div>
  <div class="row">
    <button class="b" id="hint">İpucu</button>
    <button class="b main" id="again">Karıştır</button>
    <span class="moves">Doğru yerde: <span id="mv">0</span>/12<br>İpucu kullanımı: <span id="hc">0</span></span>
  </div>
  <div class="row" id="test" style="display:none"><input type="file" id="file" accept="image/*"></div>
  <div id="win">
    <h2>🎉 Harika, rover hazır!</h2>
    <p>Mars’ta gezen robotlara rover denir. Kayaları inceler, fotoğraf çeker ve bulduklarını Dünya’ya gönderir.</p>
    <p id="wh"></p>
  </div>
</div>

function prep(src) {
  return new Promise(function (res) {
    var im = new Image();
    im.onload = function () {
      try {
        var c = document.createElement("canvas"); c.width = W; c.height = H;
        var x = c.getContext("2d");
        var k = Math.max(W / im.width, H / im.height), w = im.width * k, h = im.height * k;
        x.drawImage(im, (W - w) / 2, (H - h) / 2, w, h);
        res(c.toDataURL("image/jpeg", 0.88));
      } catch (e) { res(src); }
    };
    im.onerror = function () { res(null); };
    im.src = src;
  });
}

function pw() { return (board.clientWidth - 6 * (COLS - 1)) / COLS; }
function ph_() { return (board.clientHeight - 6 * (ROWS - 1)) / ROWS; }

function layout() {
  var tw = pw();
  tray.style.setProperty("--tw", tw + "px");
  tray.style.setProperty("--th", ph_() + "px");
}

function mark(el, inSlot) { el.classList.toggle("inslot", inSlot); }

function check() {
  var ok = 0;
  board.querySelectorAll(".slot").forEach(function (s) {
    var c = s.firstElementChild;
    if (c && c.dataset.id === s.dataset.id) ok++;
  });
  $("mv").textContent = ok;
  if (ok === N) { won = true; $("wh").textContent = hints ? "İpucu kullanımı: " + hints : "Hiç ipucu kullanmadın, tebrikler!"; $("win").style.display = "block"; }
}

function build() {
  board.style.gridTemplateColumns = "repeat(" + COLS + ",1fr)";
  board.style.gridTemplateRows = "repeat(" + ROWS + ",1fr)";
  tray.style.gridTemplateColumns = "repeat(" + COLS + ",var(--tw))";
  board.innerHTML = ""; tray.innerHTML = "";
  var pk = $("peek"); pk.innerHTML = "";
  pk.style.gridTemplateColumns = "repeat(" + COLS + ",1fr)";
  pk.style.gridTemplateRows = "repeat(" + ROWS + ",1fr)";
  for (var q = 0; q < N; q++) {
    var c = document.createElement("div");
    c.style.backgroundImage = "url(" + bg + ")";
    c.style.backgroundSize = COLS * 100 + "% " + ROWS * 100 + "%";
    c.style.backgroundPosition = (q % COLS) / (COLS - 1) * 100 + "% " + Math.floor(q / COLS) / (ROWS - 1) * 100 + "%";
    pk.appendChild(c);
  }
  won = false; hints = 0; $("peek").style.display = "none"; $("hint").textContent = "İpucu"; $("hc").textContent = 0; $("mv").textContent = 0; $("win").style.display = "none";
  var ids = [], i;
  for (i = 0; i < N; i++) {
    ids.push(i);
    var s = document.createElement("div");
    s.className = "slot"; s.dataset.id = i; board.appendChild(s);
  }
  do {
    for (i = N - 1; i > 0; i--) { var r = Math.floor(Math.random() * (i + 1)); var t = ids[i]; ids[i] = ids[r]; ids[r] = t; }
  } while (ids.every(function (v, k) { return v === k; }));
  ids.forEach(function (id) {
    var p = document.createElement("div");
    p.className = "p"; p.dataset.id = id;
    p.style.backgroundImage = "url(" + bg + ")";
    p.style.backgroundSize = COLS * 100 + "% " + ROWS * 100 + "%";
    p.style.backgroundPosition = (id % COLS) / (COLS - 1) * 100 + "% " + Math.floor(id / COLS) / (ROWS - 1) * 100 + "%";
    attach(p);
    tray.appendChild(p);
  });
  layout();
}

function attach(p) {
  var ph = null, from = null, on = false, w = 0, h = 0;
  function move(e) {
    p.style.left = e.clientX - w / 2 + "px";
    p.style.top = e.clientY - h / 2 + "px";
  }
  function put(x) {
    if (from === tray) { tray.insertBefore(x, ph); mark(x, false); }
    else { from.appendChild(x); mark(x, true); }
  }
  p.addEventListener("pointerdown", function (e) {
    if (won) return;
    e.preventDefault();
    p.setPointerCapture(e.pointerId);
    from = p.parentNode;
    w = pw(); h = ph_();
    if (from === tray) { ph = document.createElement("div"); ph.className = "ph"; tray.insertBefore(ph, p); }
    on = true;
    p.classList.add("drag");
    p.style.width = w + "px"; p.style.height = h + "px";
    move(e);
  });
  p.addEventListener("pointermove", function (e) { if (on) move(e); });
  function end(e) {
    if (!on) return;
    on = false;
    p.style.pointerEvents = "none";
    var el = document.elementFromPoint(e.clientX, e.clientY);
    p.style.pointerEvents = "";
    var slot = el && el.closest ? el.closest(".slot") : null;
    p.classList.remove("drag");
    p.style.left = p.style.top = p.style.width = p.style.height = "";
    p.remove();
    if (!slot || slot === from) { put(p); }
    else {
      var other = slot.firstElementChild;
      if (other) { other.remove(); put(other); }
      slot.appendChild(p); mark(p, true);
    }
    if (ph) { ph.remove(); ph = null; }
    check();
  }
  p.addEventListener("pointerup", end);
  p.addEventListener("pointercancel", end);
}

function setImage(src) {
  prep(src).then(function (d) {
    bg = d || svgData();
    build();
  });
}

$("again").onclick = build;
$("hint").onclick = function () {
  var p = $("peek");
  if (p.style.display === "grid") {
    p.style.display = "none"; $("hint").textContent = "İpucu";
  } else {
    hints++; $("hc").textContent = hints;
    p.style.display = "grid"; $("hint").textContent = "İpucunu kapat";
  }
};
window.addEventListener("resize", layout);

if (location.search.indexOf("test") > -1) {
  $("test").style.display = "flex";
  $("file").onchange = function (e) {
    var f = e.target.files[0]; if (!f) return;
    var r = new FileReader(); r.onload = function () { setImage(r.result); }; r.readAsDataURL(f);
  };
}

setImage(IMG_SRC || svgData());
</script>
